# Entity Discovery Benchmark
# Evaluates models on precision/recall of character, location, and prop discovery.
# Entity discovery is recall-led but precision-sensitive because every result
# creates downstream bible work.
# This full-script, three-taxonomy call is a capability detector. Production
# discovery is incremental and chunked, with seeded existing entities and an
# optional verification pass, so this task must not select its runtime model.
#
# Usage: cd benchmarks && promptfoo eval -c tasks/entity-discovery.yaml --no-cache -j 3
# View:  promptfoo view

description: "Entity discovery from two repo-owned screenplays — The Mariner and Open Frequency"

# Use Opus as judge — strongest reasoning, cross-provider for OpenAI/Gemini models
defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6

prompts:
  - file://../prompts/entity-discovery.txt

providers:
  # --- Cheap tier ---
  - id: openai:gpt-4.1-nano
    label: "GPT-4.1 Nano"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:chat:gpt-5.4-nano
    label: "GPT-5.4 Nano"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:gpt-4.1-mini
    label: "GPT-4.1 Mini"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:chat:gpt-5.4-mini
    label: "GPT-5.4 Mini"
    config:
