tests:
  - vars:
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-entity-discovery.json
    assert: &entity_discovery_assertions
      - type: python
        value: file://../scorers/entity_discovery_scorer.py
      - type: llm-rubric
        value: |
          Evaluate the candidate entity inventory only against the supplied screenplay.
          Do not rely on outside knowledge or treat this rubric as an answer key.

          SOURCE SCREENPLAY
          =================
          {{screenplay}}
          =================

          Grade all of these dimensions:
          1. Category validity: characters are narratively specific people,
             locations are separately staged named places, and props are
             distinctive story-relevant objects rather than arbitrary nouns.
          2. Recall: the inventory covers the screenplay's major and meaningful
             entities in all three categories, including mentioned entities when
             they have real story consequence.
          3. Precision: generic extras, ordinary wardrobe, set dressing,
             furniture, scenery, generic weapons/tools, sounds, materials,
             inscriptions, and duplicate aliases are excluded unless the source
             clearly individualizes them as story-significant entities.
          4. Grounding: every returned entity appears in or is unambiguously
             supported by the source, and no category contains invented names.
          5. Canonical naming and JSON contract: names are deduplicated and the
             candidate contains exactly the three requested arrays.

          A schema-only or generic answer must fail. A noun dump must not pass
          merely because it happens to include the major entities. Score 0.80 or
          higher, and pass, only when recall is strong and any precision defects
          are genuinely minor. Material omissions, category errors, hallucinated
          entities, or systematic over-inclusion must fail.

  # Second-corpus case: distinguishes people from a named animal, a consequential
  # generic radio voice, story props, and ordinary storm-shelter set dressing.
  - vars:
      screenplay: file://../../tests/fixtures/ingest_inputs/open_frequency_short.fountain
      golden_path: golden/open-frequency-entity-discovery.json
    assert: *entity_discovery_assertions
