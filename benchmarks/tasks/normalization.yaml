# Normalization Benchmark
# Evaluates models on converting prose/broken formatting to valid Fountain screenplay.
# This mirrors CineForge's script_normalize_v1 module — the LLM-assisted tier.
#
# Usage: cd benchmarks && promptfoo eval -c tasks/normalization.yaml
# View:  promptfoo view

description: "Script normalization — prose and two distinct broken-Fountain cases"

# Use Opus as judge
defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6

prompts:
  - file://../prompts/normalization.txt

providers:
  # --- Cheap tier ---
  - id: openai:gpt-4.1-nano
    label: "GPT-4.1 Nano"
    config:
      temperature: 0
      max_tokens: 4096

  - id: openai:chat:gpt-5.4-nano
    label: "GPT-5.4 Nano"
    config:
      temperature: 0
      max_tokens: 4096

  - id: openai:gpt-4.1-mini
    label: "GPT-4.1 Mini"
    config:
      temperature: 0
      max_tokens: 4096

  - id: openai:chat:gpt-5.4-mini
    label: "GPT-5.4 Mini"
    config:
      temperature: 0
      max_tokens: 4096

  - id: google:gemini-2.5-flash-lite
    label: "Gemini 2.5 Flash Lite"
    config:
      maxOutputTokens: 16384

  # --- Mid tier ---
  - id: openai:gpt-4.1
    label: "GPT-4.1"
    config:
      temperature: 0
      max_tokens: 4096

  - id: anthropic:messages:claude-haiku-4-5-20251001
    label: "Claude Haiku 4.5"
    config:
      temperature: 0
      max_tokens: 4096

  - id: anthropic:messages:claude-sonnet-4-5-20250929
    label: "Claude Sonnet 4.5"
    config:
      temperature: 0
      max_tokens: 4096

  - id: anthropic:messages:claude-sonnet-4-6
    label: "Claude Sonnet 4.6"
    config:
      temperature: 0
      max_tokens: 4096

  - id: google:gemini-2.5-flash
    label: "Gemini 2.5 Flash"
    config:
      maxOutputTokens: 16384

  - id: google:gemini-3-flash-preview
    label: "Gemini 3 Flash"
    config:
      maxOutputTokens: 65536

  # --- SOTA tier ---
  - id: openai:gpt-5.2
    label: "GPT-5.2"
    config:
      temperature: 0
      max_tokens: 4096

  - id: openai:gpt-5.5
    label: "GPT-5.5"
    config:
      temperature: 0
      max_tokens: 4096

  - id: file://../providers/openai_responses_provider.py
    label: "GPT-5.5 Pro"
    config:
      model: gpt-5.5-pro
      temperature: 0
      max_tokens: 4096

  - id: anthropic:messages:claude-opus-4-6
    label: "Claude Opus 4.6"
    config:
      temperature: 0
      max_tokens: 4096

  - id: google:gemini-2.5-pro
    label: "Gemini 2.5 Pro"
    config:
      maxOutputTokens: 16384

  - id: google:gemini-3-pro-preview
    label: "Gemini 3 Pro"
    config:
      maxOutputTokens: 65536

tests:
  # Test 1: Prose narrative — no Fountain formatting at all
  - vars:
      source_text: file://../input/normalize-prose.txt
      golden_path: golden/normalize-signal-golden.json
    assert:
      - type: python
        value: file://../scorers/normalization_scorer.py
      - &normalization_rubric
        type: llm-rubric
        value: |
          Evaluate the candidate normalization only against the supplied source text.
          Derive the required structure from the source rather than from a presumed
          reference answer.

          SOURCE TEXT
          ===========
          {{source_text}}
          ===========

          Grade all of these dimensions:
          1. Content fidelity: every dialogue line, speaker, action, narrative fact,
             title/transition, and event order is preserved. Typographic quote marks
             and prose speech tags may change only as required by Fountain structure.
          2. Fountain structure: source-supported scene headings, character cues,
             dialogue, parentheticals, action paragraphs, title fields, and
             transitions are correctly represented without unsupported headings or
             speaker assignments.
          3. Formatting hygiene: no markdown, code fences, JSON, escaped punctuation,
             commentary, lowercase Fountain cues/headings, or other input artifact
             remains.
          4. Precision: the output neither invents content nor silently summarizes,
             omits, duplicates, contradicts, or reorders source content.

          A copied raw input that remains structurally broken must fail. A generic,
          invented, contradictory, schema-only, or formatting-only shell that loses
          source content must fail. Legitimate mechanical Fountain conversion is
          allowed. Score 0.80 or higher, and pass, only when both source fidelity and
          formatting are strong and remaining defects are genuinely minor.

  # Test 2: Broken Fountain — has structure but with markdown artifacts
  - vars:
      source_text: file://../input/normalize-broken-fountain.txt
      golden_path: golden/normalize-signal-golden.json
    assert:
      - type: python
        value: file://../scorers/normalization_scorer.py
      - *normalization_rubric

  # Test 3: Repo-authored difficult case — source-faithful Open Frequency excerpt
  # with Markdown, lowercase cues/headings, escaped punctuation, and a malformed
  # radio parenthetical. See the corpus provenance sidecar for exact derivation.
  - vars:
      source_text: file://../input/normalize-open-frequency-corrupted.fountain
      golden_path: golden/normalize-open-frequency-corrupted-golden.json
    assert:
      - type: python
        value: file://../scorers/normalization_scorer.py
      - *normalization_rubric
