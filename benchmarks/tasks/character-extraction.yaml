tests:
  # Test 1: THE MARINER — protagonist, present in most scenes, emotional arc
  - vars:
      character_name: "THE MARINER"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert:
      - type: python
        value: file://../scorers/character_extraction_scorer.py
      - type: llm-rubric
        value: |
          Evaluate only the JSON character extraction for THE MARINER against the source
          screenplay supplied below. Do not assume a claim is grounded merely because it
          sounds plausible or repeats a criterion.

          Verified target criteria:
          1. Identity: character_id is "the-mariner", the canonical cue name is THE MARINER,
             aliases include the source names Billy, Will, Mariner, Young Mariner, and Bosun,
             and narrative_role is protagonist.
          2. Appearance/gear: broad stoic bearded face, pro-wrestler build, knit cap/mask,
             anchor bracers, weighted fishing-net cape, fish hooks/bandolier, rubber boots,
             metal-edged oar, and later a bright-orange flare gun. Do not require every detail
             in one sentence, but reject invented appearance.
          3. Relationships: Rose is his sister, Dad is his parent, and Salvatori is an
             adversary. These must be represented as correctly typed relationship objects,
             not merely mentioned in prose.
          4. Arc/facts: he tracked Rose through an AirTag; follows a code of "honesty,
             bravery, and grit"; believes Dad died and idealizes him; learns Dad was abusive,
             alcoholic, and abandoned him; and Rose's final speech lets him reclaim heroism
             independently of Dad. His outward strength/rigidity and wounded vulnerability
             should both be captured without inventing an ending beyond CUT TO BLACK.
          5. Scene presence must cover the source scenes in which he appears or is heard and
             must not add CITY CENTRE, BUILDING FRONT, or another scene where he is absent.

          Judge contract (hard gates):
          - Require exactly the prompt's top-level and nested schema, usable numeric
            confidences, the correct target identity, relationships in the correct typed field,
            and source-faithful scene identities. A schema-only object is not a pass.
          - Check every explicit_evidence quote against the source and check that its
            source_scene governs that passage. Any fabricated evidence, materially wrong scene,
            invented alias/relationship/fact, or confident contradiction is a hard failure.
          - Do not award credit when an answer copies criterion words into a description,
            rationale, or unrelated field. Missing typed evidence cannot be replaced by generic
            padding, fluent prose, or keyword repetition.
          - Legitimate paraphrase is allowed in description, rationale, dialogue summary, and
            relationship evidence when the meaning is source-supported. Near-direct evidence
            quotes may normalize punctuation, but may not change who did what or where.
          - Set pass=false if any hard gate fails or a critical relationship/arc element is
            absent. A true pass requires both grounded substance and the complete contract.

          SOURCE SCREENPLAY:
          ==========
          {{screenplay}}
          ==========

  # Tests 4-12 exercise every remaining maintained character golden. The subject prompt
  # keeps this screenplay before the varying target so provider prefix caches can reuse
  # the full source while preserving production's single-character extraction contract.
  - vars:
      character_name: "SALVATORI"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert: &secondary_character_assertions
      - type: python
        value: file://../scorers/character_extraction_scorer.py
      - type: llm-rubric
        value: |
          Evaluate only the JSON extraction for {{character_name}} against the source
          screenplay below. Derive truth from that screenplay; the target name is data,
          not evidence.

          Judge contract (hard gates):
          - Require exactly the prompt's top-level and nested schema, numeric confidences,
            the correct identity and maintained role vocabulary, relationships in the correct
            typed field, and a complete exact scene-presence set. A schema-only object fails.
          - Verify each explicit-evidence quote occurs under its exact governing source heading.
            Evidence may truthfully discuss {{character_name}} in a scene where the character
            is absent, but that heading must not be added to scene_presence.
          - Any fabricated quote, invented relationship/alias/fact, extra relationship, wrong
            scene, or confident contradiction is a hard failure. Generic padding cannot replace
            missing typed evidence, facts, traits, scenes, aliases, or relationships.
          - Legitimate paraphrase is allowed in analytical prose and relationship evidence, but
            not in near-direct evidence quotes when it changes who did what or where.
          - Set pass=false when any hard gate fails. A pass requires grounded substance and the
            complete contract, not plausibility or keyword repetition.

          SOURCE SCREENPLAY:
          ==========
          {{screenplay}}
          ==========

  - vars:
      character_name: "VINNIE"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert: *secondary_character_assertions

  - vars:
      character_name: "ROSCO"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert: *secondary_character_assertions

  - vars:
      character_name: "MIKEY"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert: *secondary_character_assertions

  - vars:
      character_name: "CARLOS"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert: *secondary_character_assertions

  - vars:
      character_name: "THUG 1"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert: *secondary_character_assertions

  - vars:
      character_name: "THUG 2"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert: *secondary_character_assertions

  - vars:
      character_name: "THUG 3"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert: *secondary_character_assertions

  - vars:
      character_name: "THUGS"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert: *secondary_character_assertions

  # Test 2: ROSE — co-lead, sharp dialogue, hidden backstory
  - vars:
      character_name: "ROSE"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert:
      - type: python
        value: file://../scorers/character_extraction_scorer.py
      - type: llm-rubric
        value: |
          Evaluate only the JSON character extraction for ROSE against the source screenplay
          supplied below. Do not assume a claim is grounded merely because it sounds plausible
          or repeats a criterion.

          Verified target criteria:
          1. Identity: character_id is "rose", the canonical cue name is ROSE, source aliases
             are Rosey and Rosie, and narrative_role is supporting.
          2. Appearance/voice: she is in her mid-30s, wears a Tim Hortons uniform, and is
             resourceful, sharp-tongued, brave, emotionally grounded, and cunning. Do not invent
             physical features the source never supplies.
          3. Relationships: The Mariner is her brother, Vinnie is her ex-boyfriend, Dad is her
             parent, and Salvatori is an adversary. These must be correctly typed relationship
             objects, not facts copied into unrelated prose.
          4. Arc/facts: she hid a blockchain password on a chip in her purse lining; stole about
             $20 million in gang money; goes back for the purse; knows Dad is alive in Chimney
             Bay and reveals his abandonment/abuse; and delivers the final speech redefining
             Mariner as a hero independent of Dad.
          5. Scene presence must cover the source scenes in which Rose appears or is heard and
             must not place her in either coastline memory or another scene where she is absent.

          Judge contract (hard gates):
          - Require exactly the prompt's top-level and nested schema, usable numeric
            confidences, the correct target identity, relationships in the correct typed field,
            and source-faithful scene identities. A schema-only object is not a pass.
          - Check every explicit_evidence quote against the source and check that its
            source_scene governs that passage. Any fabricated evidence, materially wrong scene,
            invented alias/relationship/fact, or confident contradiction is a hard failure.
          - Do not award credit when an answer copies criterion words into a description,
            rationale, or unrelated field. Missing typed evidence cannot be replaced by generic
            padding, fluent prose, or keyword repetition.
          - Legitimate paraphrase is allowed in description, rationale, dialogue summary, and
            relationship evidence when the meaning is source-supported. Near-direct evidence
            quotes may normalize punctuation, but may not change who did what or where.
          - Set pass=false if any hard gate fails or a critical relationship/arc element is
            absent. A true pass requires both grounded substance and the complete contract.

          SOURCE SCREENPLAY:
          ==========
          {{screenplay}}
          ==========

  # Test 3: DAD — flashback-only, dual presentation, thematic catalyst
  - vars:
      character_name: "DAD"
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-characters.json
    assert:
      - type: python
        value: file://../scorers/character_extraction_scorer.py
      - type: llm-rubric
        value: |
          Evaluate only the JSON character extraction for DAD against the source screenplay
          supplied below. Do not assume a claim is grounded merely because it sounds plausible
          or repeats a criterion.

          Verified target criteria:
          1. Identity: character_id is "dad", the canonical cue name is DAD, Pa is a source
             alias, narrative_role is supporting, and he physically appears only in flashbacks.
             Present-day dialogue about him is not scene presence.
          2. Relationships: he is parent to The Mariner and Rose. Do not invent a relationship
             with Salvatori or any present-day gang character.
          3. Dual presentation: idealized memories show a warm fisherman teaching young Mariner
             to cast and lift; revealed memories show an alcoholic, neglectful, violent father
             who demands beer, leaves the child shivering, punches him, and sends him to lift.
          4. Arc/facts: he abandoned Mariner, lives in Chimney Bay, and was believed dead by
             Mariner. His self-aggrandizing hero lesson and marked Maritime dialect cues such as
             b'y, bosun, 'e, and anudder are source-supported; a precise geographic diagnosis of
             the dialect is not required.

          Judge contract (hard gates):
          - Require exactly the prompt's top-level and nested schema, usable numeric
            confidences, the correct target identity, relationships in the correct typed field,
            and source-faithful scene identities. A schema-only object is not a pass.
          - Check every explicit_evidence quote against the source and check that its
            source_scene governs that passage. Any fabricated evidence, materially wrong scene,
            invented alias/relationship/fact, or confident contradiction is a hard failure.
          - Do not award credit when an answer copies criterion words into a description,
            rationale, or unrelated field. Missing typed evidence cannot be replaced by generic
            padding, fluent prose, or keyword repetition.
          - Legitimate paraphrase is allowed in description, rationale, dialogue summary, and
            relationship evidence when the meaning is source-supported. Near-direct evidence
            quotes may normalize punctuation, but may not change who did what or where.
          - Set pass=false if any hard gate fails, if a present-day scene is claimed as Dad's
            presence, or if the dual presentation/abandonment truth is missing. A true pass
            requires both grounded substance and the complete contract.

          SOURCE SCREENPLAY:
          ==========
          {{screenplay}}
          ==========

  # Test 13: MAYA — second-corpus supporting character with no source aliases,
  # an explicit family bond to Comet, and appearances across two distinct scenes.
  - vars:
      character_name: "MAYA"
      screenplay: file://../../tests/fixtures/ingest_inputs/open_frequency_short.fountain
      golden_path: golden/open-frequency-maya-character.json
    assert: *secondary_character_assertions
