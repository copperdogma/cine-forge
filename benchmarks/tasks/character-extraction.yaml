# Character Extraction Benchmark
# Evaluates models on extracting structured character data from a screenplay.
# This mirrors CineForge's character_bible_v1 module — the core AI task.
#
# Usage: cd benchmarks && promptfoo eval -c tasks/character-extraction.yaml
# View:  promptfoo view

description: "Character extraction across The Mariner and Open Frequency"

# Use Opus as judge — strongest reasoning, cross-provider for OpenAI models
defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6

prompts:
  - file://../prompts/character-extraction.txt

providers:
  # --- Cheap tier ---
  - id: openai:gpt-4.1-nano
    label: "GPT-4.1 Nano"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:gpt-4.1-mini
    label: "GPT-4.1 Mini"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: google:gemini-2.5-flash-lite
    label: "Gemini 2.5 Flash Lite"
    config:
      maxOutputTokens: 16384

  - id: google:gemini-3.1-flash-lite
    label: "Gemini 3.1 Flash Lite"
    config:
      maxOutputTokens: 65536

  # --- Mid tier ---
  - id: openai:gpt-4.1
    label: "GPT-4.1"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: anthropic:messages:claude-haiku-4-5-20251001
    label: "Claude Haiku 4.5"
    config:
      temperature: 0
      max_tokens: 4096

  - id: anthropic:messages:claude-sonnet-4-5-20250929
    label: "Claude Sonnet 4.5"
    config:
      temperature: 0
      max_tokens: 4096

  - id: anthropic:messages:claude-sonnet-4-6
    label: "Claude Sonnet 4.6"
    config:
      temperature: 0
      max_tokens: 4096

  - id: google:gemini-2.5-flash
    label: "Gemini 2.5 Flash"
    config:
      maxOutputTokens: 16384

  - id: google:gemini-3-flash-preview
    label: "Gemini 3 Flash"
    config:
      maxOutputTokens: 65536

  # --- SOTA tier ---
  - id: openai:gpt-5.2
    label: "GPT-5.2"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:gpt-5.4
    label: "GPT-5.4"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:gpt-5.5
    label: "GPT-5.5"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: file://../providers/openai_responses_provider.py
    label: "GPT-5.5 Pro"
    config:
      model: gpt-5.5-pro
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: anthropic:messages:claude-opus-4-6
    label: "Claude Opus 4.6"
    config:
      temperature: 0
      max_tokens: 4096

  - id: file://../providers/anthropic_messages_provider.py
    label: "Claude Opus 4.8"
    config:
      model: claude-opus-4-8
      max_tokens: 4096

  - id: openai:kimi-k2.6
    label: "Kimi K2.6"
    config:
      apiBaseUrl: "https://api.moonshot.ai/v1"
      apiKeyEnvar: "MOONSHOT_API_KEY"
      temperature: 1.0
      top_p: 0.95
      max_tokens: 32768
      showThinking: false
