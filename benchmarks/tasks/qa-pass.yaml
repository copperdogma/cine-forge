# QA Pass Benchmark
# Evaluates models on correctly judging AI-extracted scene data as passing or failing QA.
# This mirrors CineForge's QA verification step — the model acts as quality gate.
#
# Usage: cd benchmarks && promptfoo eval -c tasks/qa-pass.yaml
# View:  promptfoo view

description: "QA pass — independently judge scene-extraction fidelity"

# Use Opus as judge
defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6

prompts:
  - file://../prompts/qa-pass.txt

providers:
  # --- Cheap tier ---
  - id: openai:gpt-4.1-nano
    label: "GPT-4.1 Nano"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:chat:gpt-5.4-nano
    label: "GPT-5.4 Nano"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

