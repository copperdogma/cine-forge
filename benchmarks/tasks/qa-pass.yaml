tests:
  # Candidate A — independently derive the QA judgment from source
  - vars:
      scene_text: file://../fixtures/enrich-scene-elevator.txt
      extracted_data: file://../input/qa-good-scene.json
      golden_path: golden/qa-pass-golden.json
      test_key: good_scene
    assert:
      - type: python
        value: file://../scorers/qa_pass_scorer.py
      - &qa_pass_rubric
        type: llm-rubric
        value: |
          Evaluate the candidate QA judgment by independently comparing the scene
          extraction with the source. Do not assume whether the extraction or QA
          judgment should pass from a filename, test label, or rubric wording.

          SOURCE SCENE
          ============
          {{scene_text}}
          ============

          EXTRACTION BEING REVIEWED
          =========================
          {{extracted_data}}
          =========================

          Grade all of these dimensions:
          1. Verdict: independently decide passed from source fidelity. Any factual
             contradiction, fabrication, wrong identity/heading, or material omission
             requires passed=false; only genuinely minor warnings may coexist with true.
          2. Issue recall and precision: every distinct material defect is identified
             in its correct field, while accurate content is not attacked. A generic
             complaint or copied candidate wording is not a grounded issue.
          3. Severity: factual errors and meaning-changing omissions are errors;
             lesser imprecision may be a warning; notes cannot hide actual defects.
          4. Summary and confidence: the summary substantiates the verdict with source
             facts, and confidence represents certainty in this QA judgment rather
             than copying the extraction's confidence.
          5. Exact schema: the QA result uses the requested top-level and issue keys,
             valid types, and substantive descriptions. A schema-only result is not a pass.

          A generic, copied, contradictory, invented, or schema-only QA judgment must
          fail. Do not reward a fluent pass/fail claim that disagrees with its own issue
          list or the source. Score 0.80 or higher, and pass, only when the verdict,
          issues, severities, summary, and confidence are source-faithful and remaining
          defects are genuinely minor.

  # Candidate B — independently derive the QA judgment from source
  - vars:
      scene_text: file://../fixtures/enrich-scene-elevator.txt
      extracted_data: file://../input/qa-bad-scene.json
      golden_path: golden/qa-pass-golden.json
      test_key: bad_scene
    assert:
      - type: python
        value: file://../scorers/qa_pass_scorer.py
      - *qa_pass_rubric
