# QA Pass Benchmark
# Evaluates models on correctly judging AI-extracted scene data as passing or failing QA.
# This mirrors CineForge's QA verification step — the model acts as quality gate.
#
# Usage: cd benchmarks && promptfoo eval -c tasks/qa-pass.yaml
# View:  promptfoo view

description: "QA pass — independently judge scene-extraction fidelity"

# Use Opus as judge
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-opus-4-6
      config:
        max_tokens: 4096

prompts:
  - file://../prompts/qa-pass.txt

providers:
  # --- Cheap tier ---
  - id: openai:gpt-4.1-nano
    label: "GPT-4.1 Nano"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:chat:gpt-5.4-nano
    label: "GPT-5.4 Nano"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:gpt-4.1-mini
    label: "GPT-4.1 Mini"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:chat:gpt-5.4-mini
    label: "GPT-5.4 Mini"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: google:gemini-2.5-flash-lite
    label: "Gemini 2.5 Flash Lite"
    config:
      maxOutputTokens: 16384

  # --- Mid tier ---
  - id: openai:gpt-4.1
    label: "GPT-4.1"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: anthropic:messages:claude-haiku-4-5-20251001
    label: "Claude Haiku 4.5"
    config:
      temperature: 0
      max_tokens: 4096

  - id: anthropic:messages:claude-sonnet-4-5-20250929
    label: "Claude Sonnet 4.5"
    config:
      temperature: 0
      max_tokens: 4096

  - id: anthropic:messages:claude-sonnet-4-6
    label: "Claude Sonnet 4.6"
    config:
      temperature: 0
      max_tokens: 4096

  - id: google:gemini-2.5-flash
    label: "Gemini 2.5 Flash"
    config:
      maxOutputTokens: 16384

  - id: google:gemini-3-flash-preview
    label: "Gemini 3 Flash"
    config:
      maxOutputTokens: 65536

  - id: google:gemini-3.5-flash
    label: "Gemini 3.5 Flash"
    config:
      maxOutputTokens: 65536

  - id: google:gemini-3.5-flash-lite
    label: "Gemini 3.5 Flash-Lite"
    config:
      maxOutputTokens: 65536
      inputCost: 0.0000003
      outputCost: 0.0000025

  - id: google:gemini-3.6-flash
    label: "Gemini 3.6 Flash"
    config:
      maxOutputTokens: 65536
      inputCost: 0.0000015
      outputCost: 0.0000075

  - id: google:gemini-3.7-flash
    label: "Gemini 3.7 Flash"
    config:
      maxOutputTokens: 65536
      thinkingConfig:
        thinkingLevel: low
      responseMimeType: application/json
      responseSchema:
        type: object
        required: [passed, confidence, issues, summary]
        properties:
          passed: {type: boolean}
          confidence: {type: number, minimum: 0, maximum: 1}
          issues:
            type: array
            items:
              type: object
              required: [severity, description, location]
              properties:
                severity: {type: string, enum: [error, warning, note]}
                description: {type: string}
                location: {type: string}
          summary: {type: string}
      inputCost: 0.00000075
      outputCost: 0.00000375

  # --- SOTA tier ---
  - id: openai:gpt-5.2
    label: "GPT-5.2"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:gpt-5.5
    label: "GPT-5.5"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: file://../providers/openai_responses_provider.py
    label: "GPT-5.5 Pro"
    config:
      model: gpt-5.5-pro
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: xai:grok-4.3
    label: "Grok 4.3"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: xai:grok-4.5
    label: "Grok 4.5"
    config:
      max_tokens: 4096
      reasoning_effort: high
      showThinking: false
      response_format: { type: "json_object" }

  - id: openai:kimi-k2.6
    label: "Kimi K2.6"
    config:
      apiBaseUrl: "https://api.moonshot.ai/v1"
      apiKeyEnvar: "MOONSHOT_API_KEY"
      temperature: 1.0
      top_p: 0.95
      max_tokens: 32768
      showThinking: false
      response_format: { type: "json_object" }

  - id: anthropic:messages:claude-opus-4-6
    label: "Claude Opus 4.6"
    config:
      temperature: 0
      max_tokens: 4096

  - id: google:gemini-2.5-pro
    label: "Gemini 2.5 Pro"
    config:
      maxOutputTokens: 16384

  - id: google:gemini-3-pro-preview
    label: "Gemini 3 Pro"
    config:
      maxOutputTokens: 65536

  # --- Exact shared qa_check runtime boundary ---
  # These providers ignore the benchmark prompt marker and call the production
  # prompt builder plus provider-enforced QAResult schema directly.
  - id: file://../providers/qa_runtime_provider.py
    label: "GPT-4.1 Mini Current Runtime"
    config:
      model: gpt-4.1-mini
      max_tokens: 1200
      max_retries: 2
      request_timeout_seconds: 120

  - id: file://../providers/qa_runtime_provider.py
    label: "Gemini 3.7 Flash Current Runtime"
    config:
      model: gemini-3.7-flash
      max_tokens: 1200
      max_retries: 2
      request_timeout_seconds: 120

tests:
  # Candidate A — independently derive the QA judgment from source
  - vars:
      scene_text: file://../fixtures/enrich-scene-elevator.txt
      extracted_data: file://../input/qa-good-scene.json
      golden_path: golden/qa-pass-golden.json
      test_key: good_scene
    assert:
      - type: python
        value: file://../scorers/qa_pass_scorer.py
      - &qa_pass_rubric
        type: llm-rubric
        value: |
          Evaluate the candidate QA judgment by independently comparing the scene
          extraction with the source. Do not assume whether the extraction or QA
          judgment should pass from a filename, test label, or rubric wording.

          SOURCE SCENE
          ============
          {{scene_text}}
          ============

          EXTRACTION BEING REVIEWED
          =========================
          {{extracted_data}}
          =========================

          Grade all of these dimensions:
          1. Verdict: independently decide passed from source fidelity. Any factual
             contradiction, fabrication, wrong identity/heading, or material omission
             requires passed=false; only genuinely minor warnings may coexist with true.
          2. Issue recall and precision: every distinct material defect is identified
             in its correct field, while accurate content is not attacked. A generic
             complaint or copied candidate wording is not a grounded issue. Each issue
             identifies both the candidate defect and the source fact/correction, and
             states that relation directly and affirmatively. Negation, double
             negation, hedging/modality (`may`, `might`, `could`, `perhaps`, `appears
             to`, `seems to`), or correction-only wording is not defect evidence, and
             one issue cannot earn credit for multiple repair families.
          3. Severity: factual errors and meaning-changing omissions are errors;
             lesser imprecision may be a warning; notes cannot hide actual defects.
          4. Summary and confidence: for passed=true, the summary gives a substantive
             positive judgment across at least three reviewed dimensions but need not
             recite selected source details that the runtime contract does not request.
             A contrastive material-fault clause invalidates the positive judgment.
             For passed=false, it gives actionable,
             source-grounded defect feedback because runtime repair/escalation consumers
             may use it. Confidence represents certainty in this QA judgment rather
             than copying the extraction's confidence.
          5. Exact schema: the QA result uses the requested top-level and issue keys,
             valid types, and substantive descriptions. A schema-only result is not a pass.

          A generic, copied, contradictory, invented, or schema-only QA judgment must
          fail. Do not reward a fluent pass/fail claim that disagrees with its own issue
          list or the source. Score 0.80 or higher, and pass, only when the verdict,
          issues, severities, summary, and confidence are source-faithful and remaining
          defects are genuinely minor.

  # Candidate B — independently derive the QA judgment from source
  - vars:
      scene_text: file://../fixtures/enrich-scene-elevator.txt
      extracted_data: file://../input/qa-bad-scene.json
      golden_path: golden/qa-pass-golden.json
      test_key: bad_scene
    assert:
      - type: python
        value: file://../scorers/qa_pass_scorer.py
      - *qa_pass_rubric
