# Prop Extraction Benchmark
# All maintained prop goldens are independent cases. Historical three-case
# scores are not comparable to this strict runtime-schema contract.

description: "Prop extraction from screenplay — The Mariner (all props)"

defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6
  assert:
    - type: python
      value: file://../scorers/bible_extraction_scorer.py
    - type: llm-rubric
      value: |
        Evaluate only the candidate JSON for the single requested prop
        {{prop_name}} against the verified contract and source below.

        Exact identity contract:
        - prop_id: {{expected_id}}
        - name: {{expected_name}}
        - scene_presence (complete exact source-heading set): {{expected_scenes}}
        - associated_characters (complete exact persistent-owner/wielder set):
          {{expected_associated_characters}}

        Verified minimum source concepts:
        - physical details: {{verified_physical}}
        - use and story facts: {{verified_facts}}
        - narrative significance: {{verified_narrative}}

        Hard gates:
        - Require exactly one unfenced JSON object with exactly prop_id, name,
          description, scene_presence, associated_characters,
          narrative_significance, and overall_confidence. Require the documented
          types and a finite numeric confidence from 0 through 1.
        - The identity and scene set must match the exact contract. Facts repeated
          in prose cannot substitute for an omitted or partial typed value, and
          no second entity may be returned.
        - associated_characters may include only lowercase underscore IDs for
          persistent, continuity-critical owners or wielders established by the
          source. Brief contact is not enough; an empty array is valid.
        - Verify every material claim against the screenplay. Fabricated or
          negated evidence, a wrong scene, invented appearance/origin/ownership,
          or a confident contradiction is a hard failure.
        - Require grounded coverage of every verified minimum concept. The list
          is a minimum, not permission to invent other details.
        - Allow conservative paraphrase in description and narrative analysis
          when it preserves who used the prop, how, and where. Do not demand
          unsupported symbolism or treat plausible genre padding as evidence.
        Set pass=false if any hard gate fails.

        SOURCE SCREENPLAY:
        ==========
        {{screenplay}}
        ==========

prompts:
  - file://../prompts/prop-extraction.txt

