# Location Extraction Benchmark
# All maintained location goldens are independent cases. Historical three-case
# scores are not comparable to this strict contract.

description: "Location extraction from screenplay — The Mariner (all locations)"

defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6
  assert:
    - type: python
      value: file://../scorers/bible_extraction_scorer.py
    - type: llm-rubric
      value: |
        Evaluate only the candidate JSON for the single requested location
        {{location_name}} against the verified contract and source below.

        Exact identity contract:
        - location_id: {{expected_id}}
        - name: {{expected_name}}
        - aliases (complete set, no additions): {{expected_aliases}}
        - scene_presence (complete exact source-heading set): {{expected_scenes}}

        Verified minimum source concepts:
        - physical_traits: {{verified_physical}}
        - key story facts: {{verified_facts}}
        - narrative significance: {{verified_narrative}}

        Hard gates:
        - Require exactly one unfenced JSON object with exactly location_id, name,
          aliases, description, physical_traits, scene_presence,
          narrative_significance, and overall_confidence. Require the documented
          types and a finite numeric confidence from 0 through 1.
        - The identity, aliases, and scene set must match the exact contract.
          Facts repeated in prose cannot substitute for an omitted or partial
          typed value, and no second entity may be returned.
        - Verify every material claim against the screenplay. Fabricated or
          negated evidence, an unsupported alias, a wrong scene, facts imported
          from another location, or a confident contradiction is a hard failure.
        - Require grounded coverage of every verified minimum concept. The list
          is a minimum, not permission to invent other details.
        - Allow conservative paraphrase in description and narrative analysis
          when it preserves the source meaning. Do not demand exact wording for
          analytical prose or treat plausible genre padding as evidence.
        Set pass=false if any hard gate fails.

        SOURCE SCREENPLAY:
        ==========
        {{screenplay}}
        ==========

prompts:
  - file://../prompts/location-extraction.txt

