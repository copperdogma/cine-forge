# Scene Extraction Benchmark
# Evaluates models on extracting structured scene data from a screenplay.
#
# Usage: cd benchmarks && promptfoo eval -c tasks/scene-extraction.yaml
# View:  promptfoo view

description: "Scene extraction from two repo-owned screenplays — The Mariner and Open Frequency"

# Use Opus as judge — strongest reasoning, cross-provider for OpenAI models
defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6

prompts:
  - file://../prompts/scene-extraction.txt

providers:
  # --- Cheap tier ---
  - id: openai:gpt-4.1-nano
    label: "GPT-4.1 Nano"
    config:
      temperature: 0
      max_tokens: 8192
      response_format: { type: "json_object" }

  - id: openai:chat:gpt-5.4-nano
    label: "GPT-5.4 Nano"
    config:
      temperature: 0
      max_tokens: 8192
      response_format: { type: "json_object" }

  - id: openai:gpt-4.1-mini
    label: "GPT-4.1 Mini"
    config:
      temperature: 0
      max_tokens: 8192
      response_format: { type: "json_object" }

  - id: openai:chat:gpt-5.4-mini
    label: "GPT-5.4 Mini"
    config:
      temperature: 0
      max_tokens: 8192
      response_format: { type: "json_object" }

  # --- Mid tier ---
  - id: openai:gpt-4.1
    label: "GPT-4.1"
    config:
      temperature: 0
      max_tokens: 8192
      response_format: { type: "json_object" }

  - id: anthropic:messages:claude-haiku-4-5-20251001
    label: "Claude Haiku 4.5"
    config:
      temperature: 0
      max_tokens: 8192

  - id: anthropic:messages:claude-sonnet-4-5-20250929
    label: "Claude Sonnet 4.5"
    config:
      temperature: 0
      max_tokens: 8192

  - id: anthropic:messages:claude-sonnet-4-6
    label: "Claude Sonnet 4.6"
    config:
      temperature: 0
      max_tokens: 8192

  # --- SOTA tier ---
  - id: openai:gpt-5.2
    label: "GPT-5.2"
    config:
      temperature: 0
      max_tokens: 8192
      response_format: { type: "json_object" }

  - id: openai:gpt-5.5
    label: "GPT-5.5"
    config:
      temperature: 0
      max_tokens: 8192
      response_format: { type: "json_object" }

  - id: file://../providers/openai_responses_provider.py
    label: "GPT-5.5 Pro"
    config:
      model: gpt-5.5-pro
      temperature: 0
      max_tokens: 8192
      pro_min_output_tokens: 24000
      response_format: { type: "json_object" }
      timeout: 900000

  - id: xai:grok-4.3
    label: "Grok 4.3"
    config:
      temperature: 0
      max_tokens: 8192
      response_format: { type: "json_object" }

  - id: xai:grok-4.5
    label: "Grok 4.5"
    config:
      max_tokens: 8192
      reasoning_effort: high
      showThinking: false
      response_format: { type: "json_object" }

  - id: google:gemini-3.5-flash
    label: "Gemini 3.5 Flash"
    config:
      maxOutputTokens: 65536

  - id: google:gemini-3.5-flash-lite
    label: "Gemini 3.5 Flash-Lite"
    config:
      maxOutputTokens: 65536
      inputCost: 0.0000003
      outputCost: 0.0000025

  - id: google:gemini-3.6-flash
    label: "Gemini 3.6 Flash"
    config:
      maxOutputTokens: 65536
      inputCost: 0.0000015
      outputCost: 0.0000075

  - id: anthropic:messages:claude-opus-4-6
    label: "Claude Opus 4.6"
    config:
      temperature: 0
      max_tokens: 8192

tests:
  - vars:
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-scenes.json
    assert: &scene_extraction_assertions
      # Code-based scorer: structural quality
      - type: python
        value: file://../scorers/scene_extraction_scorer.py
      # AI judge: semantic quality of summaries and character identification
      - type: llm-rubric
        value: |
          Evaluate the candidate scene extraction only against the supplied
          screenplay. Derive boundaries and facts from the source itself; do not
          use a memorized scene count or conventionalize unusual source formatting.

          SOURCE SCREENPLAY
          =================
          {{screenplay}}
          =================

          Grade all of these dimensions:
          1. Boundary fidelity: emit exactly one scene for each explicit heading,
             including a BEGIN FLASHBACK heading. END FLASHBACK resumes the
             containing present scene and is not itself a scene. Do not reward
             invented headings for implied or intercut changes.
          2. Heading fidelity: headings preserve the literal source wording after
             removing Markdown escape backslashes. Do not penalize a faithful
             heading merely because the action beneath it creates an unconventional
             location or time juxtaposition.
          3. Per-scene facts: scene number, INT/EXT, location, time, character list,
             and summary are bound to the correct heading. Time may be inherited
             only from direct continuous context when the heading omits it.
          4. Character fidelity: include everyone who appears, speaks, or is heard
             off-screen in that scene, without importing characters from another
             scene or inventing individuals.
          5. Summary quality: summaries capture the material action, revelations,
             and temporal framing under the heading and remain source-grounded;
             generic restatements of headings are insufficient.
          6. Internal contract: scene_count equals the array length and numbering
             is consecutive in source order.

          A schema-only or generic extraction must fail. Missing or invented scene
          boundaries, materially wrong per-scene assignments, or source-invented
          summaries must fail. Score 0.80 or higher, and pass, only for a complete,
          trustworthy extraction; give lower scores to close but imperfect work.

  # Second-corpus case: a short ensemble script with PRE-DAWN/MORNING headings,
  # radio-only speakers, a named animal, and a repeated location.
  - vars:
      screenplay: file://../../tests/fixtures/ingest_inputs/open_frequency_short.fountain
      golden_path: golden/open-frequency-scenes.json
    assert: *scene_extraction_assertions
