tests:
  # Config detection analyzes each full screenplay.
  - vars:
      screenplay: file://../input/the-mariner.md
      golden_path: golden/the-mariner-config.json
    assert: &config_detection_assertions
      - type: python
        value: file://../scorers/config_detection_scorer.py
      - type: llm-rubric
        value: |
          Evaluate the candidate project configuration only against the supplied
          screenplay. Derive the truth independently from the source; do not use this
          rubric or the candidate's rationales as an answer key.

          SOURCE SCREENPLAY
          =================
          {{screenplay}}
          =================

          Grade all of these dimensions:
          1. Exact contract: the candidate has exactly the 10 requested fields; every
             field contains exactly a correctly typed value, finite 0-1 confidence,
             and substantive rationale. A schema-only object is not a pass.
          2. Metadata fidelity: title, format, genre, tone, runtime, cast roles,
             location count/summary, and audience are supported by this screenplay.
             Independently verify any claimed page/word estimate, character role,
             place grouping, or rating rationale rather than accepting fluent prose.
          3. Completeness and precision: meaningful source facts are covered without
             generic padding, redundant synonyms, invented entities, or unsupported
             labels. Unsupported extras count as defects.
          4. Rationale binding: every rationale points to concrete source evidence and
             actually supports its paired value. A rationale that contradicts its
             value, cites a nonexistent event, or merely repeats the field label is a
             material defect.
          5. Confidence calibration: confidence reflects source certainty and drops
             when the requested value is genuinely interpretive.

          A generic, copied, contradictory, invented, or schema-only answer must fail.
          Copied criterion language is not evidence. Legitimate source-grounded
          paraphrase is allowed. Score 0.80 or higher, and pass, only when the exact
          schema and all critical metadata are accurate and remaining defects are
          genuinely minor.

  - vars:
      screenplay: file://../../tests/fixtures/ingest_inputs/open_frequency_short.fountain
      golden_path: golden/open-frequency-config.json
    assert: *config_detection_assertions
