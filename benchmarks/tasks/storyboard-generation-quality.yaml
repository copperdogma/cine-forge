# Story 186 — storyboard generation quality and reference-fidelity evaluation

description: "Storyboard generation quality on representative multi-scene sequences with runtime reference-flow truth plus multimodal sequence judgment"

defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6

prompts:
  - file://../prompts/storyboard-understanding.txt

providers:
  - id: file://../providers/storyboard_understanding_provider.py
    label: "GPT Image 2 Storyboards"
    config:
      provider: openai
      model: gpt-5.4
      temperature: 0
      max_tokens: 2000
      max_frames: 32
      max_references: 8
      prompt_version: storyboard-understanding-v3
      sequence_root: ../storyboard_generation_quality
      candidate_variant: gpt_image_2_storyboards
      pythonExecutable: python
      timeout: 300000
  - id: file://../providers/storyboard_understanding_provider.py
    label: "GPT Image 2 Square Storyboards"
    config:
      provider: openai
      model: gpt-5.4
      temperature: 0
      max_tokens: 2000
      max_frames: 32
      max_references: 8
      prompt_version: storyboard-understanding-v3
      sequence_root: ../storyboard_generation_quality
      candidate_variant: gpt_image_2_square_storyboards
      pythonExecutable: python
      timeout: 300000
  - id: file://../providers/storyboard_understanding_provider.py
    label: "GPT Image 2 Template Grid Storyboards"
    config:
      provider: openai
      model: gpt-5.4
      temperature: 0
      max_tokens: 2000
      max_frames: 32
      max_references: 8
      prompt_version: storyboard-understanding-v3
      sequence_root: ../storyboard_generation_quality
      candidate_variant: gpt_image_2_template_grid_storyboards
      pythonExecutable: python
      timeout: 300000
  - id: file://../providers/storyboard_understanding_provider.py
    label: "GPT Image 2 Template Grid Reference Anchors"
    config:
      provider: openai
      model: gpt-5.4
      temperature: 0
      max_tokens: 2000
      max_frames: 32
      max_references: 8
      prompt_version: storyboard-understanding-v3
      sequence_root: ../storyboard_generation_quality
      candidate_variant: gpt_image_2_template_grid_reference_anchors
      pythonExecutable: python
      timeout: 300000
  - id: file://../providers/storyboard_understanding_provider.py
    label: "GPT Image 2 Beat Grid Storyboards"
    config:
      provider: openai
      model: gpt-5.4
      temperature: 0
      max_tokens: 2000
      max_frames: 32
      max_references: 8
      prompt_version: storyboard-understanding-v3
      sequence_root: ../storyboard_generation_quality
      candidate_variant: gpt_image_2_beat_grid_storyboards
      pythonExecutable: python
      timeout: 300000
  - id: file://../providers/storyboard_understanding_provider.py
    label: "Imagen 4 Storyboards"
    config:
      provider: openai
      model: gpt-5.4
      temperature: 0
      max_tokens: 2000
      max_frames: 32
      max_references: 8
      prompt_version: storyboard-understanding-v3
      sequence_root: ../storyboard_generation_quality
      candidate_variant: imagen_4_storyboards
      pythonExecutable: python
      timeout: 300000

tests:
  - description: sbq_case_001
    vars:
      storyboard_id: sbq_case_001
      target_path: storyboard_generation_quality/targets/sbq_case_001/target.json
      target_markdown: file://../storyboard_generation_quality/targets/sbq_case_001/target.md
    assert: &storyboard_quality_assertions
      - type: python
        value: file://../scorers/storyboard_understanding_scorer.py
      - type: llm-rubric
        value: |
          Evaluate this storyboard-sequence analysis against the reference below.

          Reference analysis:
          {{target_markdown}}

          Grade whether the analysis is internally precise and source-aligned,
          not whether its self-described status sounds positive. Check that
          observations cover the source-authored visual cues without copying
          target prose, compare early/late medium and subject traits, require
          opaque frame-bound evidence, and treat the abstract supplied cards as
          transport controls rather than realistic identity/location goldens.
          Penalize unsupported story details, semantic names, invalid frame ids,
          and confident reference-fidelity claims from weak evidence.

  - description: sbq_case_002
    vars:
      storyboard_id: sbq_case_002
      target_path: storyboard_generation_quality/targets/sbq_case_002/target.json
      target_markdown: file://../storyboard_generation_quality/targets/sbq_case_002/target.md
    assert: *storyboard_quality_assertions
