# Story 169 — final-render provider-floor quality comparison

description: "Reference-conditioned final-render adherence — compare five-frame candidate packets against the same versioned intended source briefs"

defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6

prompts:
  - file://../prompts/video-understanding.txt

providers:
  - id: file://../providers/video_understanding_provider.py
    label: "OpenAI Sora 2 Render"
    config:
      provider: openai
      model: gpt-5.4
      temperature: 0
      max_tokens: 1400
      max_frames: 5
      frame_policy: five_interior_sixths_jpegs_v2
      prompt_version: final-render-provider-floor-v2
      clip_root: ../final_render_provider_floor
      candidate_variant: openai_sora2
      pythonExecutable: python
      timeout: 300000

  - id: file://../providers/video_understanding_provider.py
    label: "Google Veo 3.1 Render"
    config:
      provider: openai
      model: gpt-5.4
      temperature: 0
      max_tokens: 1400
      max_frames: 5
      frame_policy: five_interior_sixths_jpegs_v2
      prompt_version: final-render-provider-floor-v2
      clip_root: ../final_render_provider_floor
      candidate_variant: google_veo31
      pythonExecutable: python
      timeout: 300000

  - id: file://../providers/video_understanding_provider.py
    label: "Google Veo 3.1 Fast Render"
    config:
      provider: openai
      model: gpt-5.4
      temperature: 0
      max_tokens: 1400
      max_frames: 5
      frame_policy: five_interior_sixths_jpegs_v2
      prompt_version: final-render-provider-floor-v2
      clip_root: ../final_render_provider_floor
      candidate_variant: google_veo31_fast
      pythonExecutable: python
      timeout: 300000

tests:
  - vars:
      clip_id: open_frequency_scene_001_studio_night
      evaluation_id: render_case_001
      target_path: final_render_provider_floor/targets/open_frequency_scene_001_studio_night/target.json
      target_markdown: file://../final_render_provider_floor/targets/open_frequency_scene_001_studio_night/target.md
    assert: &final_render_provider_assertions
      - type: python
        value: file://../scorers/video_understanding_scorer.py
      - type: llm-rubric
        value: |
          Evaluate this model's structured clip analysis against the reference below.

          Intended source brief:
          {{target_markdown}}

          The subject received only five ordered JPEG samples plus neutral timing facts and an
          opaque identifier. It did not receive audio, transcript, title, target metadata, or a
          playable clip. The brief is generation intent, not a description reverse-engineered from
          any candidate: missing intended cues are provider-adherence failures and candidate pixels
          never redefine the target. Judge only scored visual criteria that the five samples can
          establish. Ignore every audio/transcript line in the intended brief and require empty
          audio fields; do not require excluded color, camera, motion, or audio criteria. Reward an
          honest structured account whose reported visible cues satisfy the source brief, and
          penalize invented detail or ungrounded evidence. Accept equivalent visual wording.
          Pass only at score >= 0.8.

  - vars:
      clip_id: open_frequency_scene_002_water_tower_night
      evaluation_id: render_case_002
      target_path: final_render_provider_floor/targets/open_frequency_scene_002_water_tower_night/target.json
      target_markdown: file://../final_render_provider_floor/targets/open_frequency_scene_002_water_tower_night/target.md
    assert: *final_render_provider_assertions
