# Story 030 — Generated Output QA / Video Understanding Benchmark
#
# Usage:
#   source ~/.nvm/nvm.sh && nvm use 24 > /dev/null 2>&1
#   cd benchmarks
#   promptfoo eval -c tasks/video-understanding.yaml --no-cache --filter-first-n 6 -j 2 \
#     --output results/video-understanding-pilot-2026-03-19.json

description: "Video understanding — director-facing clip-packet QA for generated outputs"

defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6

prompts:
  - file://../prompts/video-understanding.txt

providers:
  - id: file://../providers/video_understanding_provider.py
    label: "GPT-5.4"
    config:
      provider: openai
      model: gpt-5.4
      temperature: 0
      max_tokens: 1400
      max_frames: 5
      frame_policy: five_evenly_spaced_jpegs_v1
      prompt_version: video-understanding-v1
      pythonExecutable: python
      timeout: 300000

  - id: file://../providers/video_understanding_provider.py
    label: "Claude Sonnet 4.6"
    config:
      provider: anthropic
      model: claude-sonnet-4-6
      temperature: 0
      max_tokens: 1400
      max_frames: 5
      frame_policy: five_evenly_spaced_jpegs_v1
      prompt_version: video-understanding-v1
      pythonExecutable: python
      timeout: 300000

  - id: file://../providers/video_understanding_provider.py
    label: "Grok 4.3"
    config:
      provider: xai
      model: grok-4.3
      temperature: 0
      max_tokens: 1400
      max_frames: 5
      frame_policy: five_evenly_spaced_jpegs_v1
      prompt_version: video-understanding-v1
      pythonExecutable: python
      timeout: 300000

  - id: file://../providers/video_understanding_provider.py
    label: "Grok 4.5"
    config:
      provider: xai
      model: grok-4.5
      max_tokens: 1400
      max_frames: 5
      frame_policy: five_evenly_spaced_jpegs_v1
