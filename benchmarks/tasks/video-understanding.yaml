      pythonExecutable: python
      timeout: 300000

  - id: file://../providers/video_understanding_provider.py
    label: "Gemini 2.5 Pro"
    config:
      provider: google
      model: gemini-2.5-pro
      temperature: 0
      max_tokens: 65536
      max_frames: 5
      frame_policy: five_evenly_spaced_jpegs_v1
      prompt_version: video-understanding-v1
      pythonExecutable: python
      timeout: 300000

  - id: file://../providers/video_understanding_provider.py
    label: "Gemini 2.5 Flash"
    config:
      provider: google
      model: gemini-2.5-flash
      temperature: 0
      max_tokens: 65536
      max_frames: 5
      frame_policy: five_evenly_spaced_jpegs_v1
      prompt_version: video-understanding-v1
      pythonExecutable: python
      timeout: 300000

  - id: file://../providers/video_understanding_provider.py
    label: "Gemini 3.1 Pro Preview"
    config:
      provider: google
      model: gemini-3.1-pro-preview
      temperature: 0
      max_tokens: 65536
      max_frames: 5
      frame_policy: five_evenly_spaced_jpegs_v1
      prompt_version: video-understanding-v1
      pythonExecutable: python
      timeout: 300000

  - id: file://../providers/video_understanding_provider.py
    label: "Gemini 3 Flash Preview"
    config:
      provider: google
      model: gemini-3-flash-preview
      temperature: 0
      max_tokens: 65536
      max_frames: 5
      frame_policy: five_evenly_spaced_jpegs_v1
      prompt_version: video-understanding-v1
      pythonExecutable: python
      timeout: 300000

  - id: file://../providers/video_understanding_provider.py
    label: "Gemini 3.5 Flash"
    config:
      provider: google
      model: gemini-3.5-flash
      temperature: 0
      max_tokens: 65536
      max_frames: 5
      frame_policy: five_evenly_spaced_jpegs_v1
      prompt_version: video-understanding-v1
      pythonExecutable: python
      timeout: 300000

tests:
  - vars:
      clip_id: dialogue_confession_push_in
      clip_title: Dialogue confession push-in
      clip_dir: ../video_understanding/dialogue_confession_push_in
      target_path: video_understanding/dialogue_confession_push_in/target.json
      target_markdown: file://../video_understanding/dialogue_confession_push_in/target.md
    assert: &video_assertions
      - type: python
        value: file://../scorers/video_understanding_scorer.py
      - type: llm-rubric
        value: |
          Evaluate this model's structured clip analysis against the reference below.

          Reference analysis:
          {{target_markdown}}

          Reward outputs that accurately capture tone, emotional read, camera language,
          motion, continuity state, and audio intent. Penalize shallow summaries,
          invented details, or missed directorial cues.

  - vars:
      clip_id: alarm_chase_whip_pan
      clip_title: Alarm chase whip pan
      clip_dir: ../video_understanding/alarm_chase_whip_pan
      target_path: video_understanding/alarm_chase_whip_pan/target.json
      target_markdown: file://../video_understanding/alarm_chase_whip_pan/target.md
