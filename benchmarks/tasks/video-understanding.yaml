# Story 030 — Generated Output QA / Video Understanding Benchmark
#
# Usage:
#   source ~/.nvm/nvm.sh && nvm use 24 > /dev/null 2>&1
#   cd benchmarks
#   promptfoo eval -c tasks/video-understanding.yaml --no-cache -j 2 \
#     --output results/video-understanding-pilot-2026-03-19.json

description: "Ordered-JPEG frame understanding — six source-backed synthetic controls"

defaultTest:
