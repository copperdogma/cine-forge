# Continuity Extraction Benchmark
# Evaluates models on extracting entity state and detecting continuity
# changes between scenes — the core task of Story 092's continuity module.
#
# Usage: cd benchmarks && promptfoo eval -c tasks/continuity-extraction.yaml --no-cache -j 3
# View:  promptfoo view

description: "Continuity extraction — entity state tracking and change detection"

# Use Opus as judge
defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6

prompts:
  - file://../prompts/continuity-extraction.txt

providers:
  # --- Cheap tier ---
  - id: openai:gpt-4.1-nano
    label: "GPT-4.1 Nano"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:gpt-4.1-mini
    label: "GPT-4.1 Mini"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: google:gemini-2.5-flash-lite
    label: "Gemini 2.5 Flash Lite"
    config:
      maxOutputTokens: 16384

  # --- Mid tier ---
  - id: openai:gpt-4.1
    label: "GPT-4.1"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: anthropic:messages:claude-haiku-4-5-20251001
    label: "Claude Haiku 4.5"
    config:
      temperature: 0
      max_tokens: 4096

  - id: anthropic:messages:claude-sonnet-4-5-20250929
    label: "Claude Sonnet 4.5"
    config:
      temperature: 0
      max_tokens: 4096

  - id: anthropic:messages:claude-sonnet-4-6
    label: "Claude Sonnet 4.6"
    config:
      temperature: 0
      max_tokens: 4096

  - id: google:gemini-2.5-flash
    label: "Gemini 2.5 Flash"
    config:
      maxOutputTokens: 16384

  - id: google:gemini-3-flash-preview
    label: "Gemini 3 Flash"
    config:
      maxOutputTokens: 65536

  # --- SOTA tier ---
  - id: openai:gpt-5.2
    label: "GPT-5.2"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: openai:gpt-5.5
    label: "GPT-5.5"
    config:
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: file://../providers/openai_responses_provider.py
    label: "GPT-5.5 Pro"
    config:
      model: gpt-5.5-pro
      temperature: 0
      max_tokens: 4096
      response_format: { type: "json_object" }

  - id: anthropic:messages:claude-opus-4-6
    label: "Claude Opus 4.6"
    config:
      temperature: 0
      max_tokens: 4096

  - id: google:gemini-2.5-pro
    label: "Gemini 2.5 Pro"
    config:
      maxOutputTokens: 16384

  - id: google:gemini-3-pro-preview
    label: "Gemini 3 Pro"
    config:
      maxOutputTokens: 65536

tests:
  # Scene 2 — establish baselines and compare only named state categories
  - vars:
      scene_text: file://../input/continuity-scene-dock-day.txt
      scene_heading: "EXT. HARBOR DOCK - DAY"
      scene_number: "2"
      scene_id: "scene_002"
      golden_path: golden/continuity-extraction-golden.json
      scene_key: dock_day
      entities_block: |
        ### Character: BILLY (key: character:billy)
        Previous state:
          (No verified prior state — establish a baseline)
        Allowed current property keys: costume, emotional_state, props_carried
        Compare for change events: none (no verified prior state)

        ### Character: JANE (key: character:jane)
        Previous state:
          (First appearance — no previous state)
        Allowed current property keys: costume, props_carried
        Compare for change events: none (first-appearance baseline)

        ### Location: HARBOR DOCK (key: location:harbor_dock)
        Previous state:
          (First appearance — no previous state)
        Allowed current property keys: lighting, time_of_day, weather
        Compare for change events: none (first-appearance baseline)

        ### Prop: OAR (key: prop:oar)
        Previous state:
          (First appearance — no previous state)
        Allowed current property keys: condition, position, ownership
        Compare for change events: none (first-appearance baseline)

        ### Prop: ENVELOPE (key: prop:envelope)
        Previous state:
          (First appearance — no previous state)
        Allowed current property keys: condition, ownership
        Compare for change events: none (first-appearance baseline)
    assert:
      - type: python
        value: file://../scorers/continuity_extraction_scorer.py
      - &continuity_rubric
        type: llm-rubric
        value: |
          Evaluate the candidate continuity extraction only against the current scene,
          the supplied prior state, and the requested property/change keys. Derive the
          expected values independently; this rubric is not an answer key.

          CURRENT SCENE
          =============
          {{scene_text}}
          =============

          ENTITY CONTRACT AND PRIOR STATE
          ===============================
          {{entities_block}}
          ===============================

          Required scene identity: {{scene_id}}
          Supplied scene heading: {{scene_heading}}

          Grade all of these dimensions:
          1. Exact identity/schema: scene_id is exact; every supplied entity appears
             exactly once; no entity or required structural key is missing, duplicated,
             renamed, or padded; every top-level and nested object has exactly the
             requested fields. A schema-only response is not a pass.
          2. Current properties: values use only allowed keys and are supported by the
             current scene or a safely persistent prior attribute. Generic state,
             invented details, and blind copying of stale positional/possession state
             are defects.
          3. Change precision and recall: listed comparison keys that materially change
             are captured one-to-one with the correct prior/new values; duplicate or
             combined events fail. An absent prior property uses literal null, while
             unchanged or first-appearance baselines do not become fabricated changes.
          4. Evidence binding: each evidence quote occurs in the current scene and
             supports that specific new value. A real but unrelated quote, copied prior
             state, reason that does not compare that event's old/new state, or guessed
             off-screen cause is a hard failure.
          5. Confidence and explicitness: numeric confidences reflect support, and
             is_explicit distinguishes direct text from defensible inference. Check
             entity, property, and change-event confidences independently.

          A generic, copied, contradictory, invented, or schema-only extraction must
          fail. Concise grammatical reordering is allowed, but current values and
          old/new comparisons must preserve the scene/prior terminology and every
          material qualifier. Reasons may paraphrase without adding claims; evidence
          must remain a faithful current-scene quote. Score 0.80 or higher, and pass,
          only when identity, properties, changes, and evidence are grounded and
          remaining defects are genuinely minor.

  # Scene 3 — compare explicit current state with the verified Scene 2 baseline.
  # Contract limitation: SceneContinuityExtraction has no absence/tombstone shape,
  # so Jane's departure is intentionally not scored or represented as a fake state.
  - vars:
      scene_text: file://../input/continuity-scene-dock-night.txt
      scene_heading: "EXT. HARBOR DOCK - NIGHT"
      scene_number: "3"
      scene_id: "scene_003"
      golden_path: golden/continuity-extraction-golden.json
      scene_key: dock_night
      entities_block: |
        ### Character: BILLY (key: character:billy)
        Previous state:
          - costume: leather jacket zipped against the wind
          - emotional_state: flat
        Allowed current property keys: costume, physical_condition, emotional_state, props_carried
        Compare for change events: costume, physical_condition, emotional_state

        ### Location: HARBOR DOCK (key: location:harbor_dock)
        Previous state:
          - time_of_day: day
          - weather: wind
          - lighting: daylight
        Allowed current property keys: lighting, time_of_day, weather
        Compare for change events: lighting, time_of_day, weather

        ### Prop: OAR (key: prop:oar)
        Previous state:
          - condition: intact, weathered oak with rope-wrapped grip
          - position: set against a piling
          - ownership: Billy's father
        Allowed current property keys: condition, position, ownership
        Compare for change events: condition, position

        ### Prop: ENVELOPE (key: prop:envelope)
        Previous state:
          - condition: sealed
        Allowed current property keys: condition
        Compare for change events: condition
    assert:
      - type: python
        value: file://../scorers/continuity_extraction_scorer.py
      - *continuity_rubric
