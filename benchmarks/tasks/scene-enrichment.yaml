tests:
  # Test 1: scene excerpt with an explicit heading but no explicit time
  - vars:
      scene_text: file://../fixtures/enrich-scene-elevator.txt
      golden_path: golden/enrich-scenes-golden.json
      scene_key: elevator
    assert:
      - type: python
        value: file://../scorers/scene_enrichment_scorer.py
      - &scene_enrichment_rubric
        type: llm-rubric
        value: |
          Evaluate the candidate scene enrichment only against the supplied excerpt.
          Do not import facts from a wider screenplay or use this rubric as an
          answer key.

          SOURCE SCENE EXCERPT
          ====================
          {{scene_text}}
          ====================

          Grade all of these dimensions:
          1. Heading and metadata fidelity: preserve an explicit heading exactly;
             do not append an inferred time. Location and INT/EXT must match the
             excerpt. When time is absent and no direct temporal evidence exists,
             the honest value is UNSPECIFIED rather than a guess.
          2. Character completeness and precision: include every individually
             identified character who appears or speaks, preserve numbered
             identities, and do not collapse several people into one generic label
             or invent people absent from the excerpt.
          3. Beat completeness: narrative beats cover the excerpt's material
             actions, revelations, conflicts, introductions, character development,
             or thematic statements, using specific source-grounded descriptions.
          4. Tone: tone_mood and tone_shifts are specific and supported by dialogue,
             action, visual detail, music, ambience, or juxtaposition in the excerpt.
          5. Scope discipline: a flashback may be identified as such, but claims
             about a later payoff, recontextualization, or wider arc must not be
             invented when the excerpt does not supply them.
          6. Schema quality: beat types, descriptions, confidences, and arrays are
             complete and semantically useful, not merely present.

          A schema-only, generic, or hallucinated enrichment must fail. A materially
          wrong heading or time, omitted active character, generic beat list, or
          invented wider-story claim must fail. Score 0.80 or higher, and pass,
          only when the enrichment is source-grounded, complete, and useful.

  # Test 2: scene excerpt with an explicit flashback heading and time
  - vars:
      scene_text: file://../fixtures/enrich-scene-flashback.txt
      golden_path: golden/enrich-scenes-golden.json
      scene_key: flashback
    assert:
      - type: python
        value: file://../scorers/scene_enrichment_scorer.py
      - *scene_enrichment_rubric
