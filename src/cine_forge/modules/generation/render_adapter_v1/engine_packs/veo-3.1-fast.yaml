pack_id: google_veo31_fast
provider: google
target_model: veo-3.1-fast-generate-preview
description: >
  Google Veo 3.1 Fast pack for low-latency scene previews and AI-previz
  candidate benchmarking. The live Google API still exposes this preview model
  id as of 2026-04-03.
preferred_prompt_style: >
  Use direct staging language with explicit camera path, subject positions,
  motion, and only the environment detail needed to read the scene.
known_strengths:
  - Lower-latency generation than the full Veo 3.1 tier.
  - Supports text/image prompting for simple previz staging tests.
  - Suitable for low-fidelity motion and blocking comparisons.
known_limitations:
  - Duration is limited to 4, 6, or 8 seconds.
  - Reference images and 1080p output require an 8-second render.
  - Direct audio upload is not supported; audio references must be translated into prompt cues.
limits:
  supported_durations_seconds: [4, 6, 8]
  supported_resolutions: ["720p", "1080p"]
  supported_aspect_ratios: ["16:9", "9:16"]
  max_reference_images: 3
  supports_first_frame: true
  supports_last_frame: true
  supports_audio_upload: false
  supports_audio_cues: true
request_defaults:
  default_resolution: "720p"
  landscape_aspect_ratio: "16:9"
  portrait_aspect_ratio: "9:16"
  reference_images_require_eight_seconds: true
  high_resolution_requires_eight_seconds: true
  benchmark_cost_per_second_usd: 0.10
  benchmark_default_duration_seconds: 4
  benchmark_consistency_strategy: "prompt_only"
  benchmark_generation_mode: "video_only"
retry_policy:
  max_attempts: 2
  poll_interval_seconds: 10
  retryable_http_statuses: [408, 429, 500, 502, 503, 504]
  retryable_error_substrings:
    - "rate limit"
    - "timeout"
    - "backendError"
