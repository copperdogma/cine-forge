pack_id: google_veo31_lite
provider: google
target_model: veo-3.1-lite-generate-preview
description: >
  Google Veo 3.1 Lite pack for the cheapest available prompt-only AI-previz
  experiments. The live Google API still exposes this preview model id as of
  2026-04-03.
preferred_prompt_style: >
  Use very direct low-detail staging language focused on camera path, blocking,
  motion, and basic location/prop readability.
known_strengths:
  - Intended for lower-cost experimentation than the full and fast Veo tiers.
  - Useful for prompt-only low-fidelity previz comparisons.
known_limitations:
  - Duration is limited to 4, 6, or 8 seconds.
  - The Story 143 plan treats this pack as prompt-only; richer reference-image consistency is not assumed.
  - Public per-second pricing was not listed in the checked Vertex AI pricing lines on 2026-04-03.
limits:
  supported_durations_seconds: [4, 6, 8]
  supported_resolutions: ["720p"]
  supported_aspect_ratios: ["16:9", "9:16"]
  max_reference_images: 0
  supports_first_frame: false
  supports_last_frame: false
  supports_audio_upload: false
  supports_audio_cues: true
request_defaults:
  default_resolution: "720p"
  landscape_aspect_ratio: "16:9"
  portrait_aspect_ratio: "9:16"
  benchmark_default_duration_seconds: 4
  benchmark_consistency_strategy: "prompt_only"
  benchmark_generation_mode: "video_only"
retry_policy:
  max_attempts: 2
  poll_interval_seconds: 10
  retryable_http_statuses: [408, 429, 500, 502, 503, 504]
  retryable_error_substrings:
    - "rate limit"
    - "timeout"
    - "backendError"
