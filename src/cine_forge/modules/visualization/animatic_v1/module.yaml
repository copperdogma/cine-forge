module_id: animatic_v1
stage: visualization
description: >
  Produces per-scene animatic artifacts and a project-level previz reel from
  shot plans, storyboard frames, and optional temp audio, then updates the
  animatics track for always-playable fallback.
input_schemas:
  - shot_plan
  - track_manifest
  - storyboard
  - sound_and_music
output_schemas:
  - animatic
  - previz_reel
  - track_manifest
parameters:
  fps:
    type: integer
    required: false
    default: 24
    description: "Frames per second for deterministic animatic renders."
  frame_width:
    type: integer
    required: false
    default: 1280
    description: "Output width for animatic clips."
  frame_height:
    type: integer
    required: false
    default: 720
    description: "Output height for animatic clips."
  storyboard_fallback_seconds:
    type: number
    required: false
    default: 2.0
    description: "Fallback scene duration when no shot duration is available."
