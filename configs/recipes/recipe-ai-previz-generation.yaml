recipe_id: ai_previz_generation
description: >
  Generate low-fidelity AI previz clips for scene-level blocking, camera, and
  motion review without conflating previz with final render.
project: {}
stages:
  - id: timeline
    module: timeline_build_v1
    params: {}
    needs: []
    store_inputs:
      scene_index: scene_index
    store_inputs_optional:
      continuity_index: continuity_index
  - id: tracks
    module: track_system_v1
    params: {}
    after: [timeline]
    store_inputs:
      timeline: timeline
    store_inputs_optional:
      continuity_index: continuity_index
  - id: shot_planning
    module: shot_plan_v1
    params:
      work_model: claude-haiku-4-5-20251001
      verify_model: claude-haiku-4-5-20251001
      escalate_model: claude-opus-4-6
      skip_qa: true
      prompt_profile: previz_fast
      max_tokens: 2600
    after: [tracks]
    store_inputs:
      normalize: canonical_script
      scene_index: scene_index
      timeline: timeline
      track_manifest: track_manifest
    store_inputs_optional:
      continuity_index: continuity_index
      intent_mood: intent_mood
      story_world: story_world
    store_inputs_all:
      rhythm_and_flow: rhythm_and_flow
      look_and_feel: look_and_feel
      sound_and_music: sound_and_music
      character_bible: character_bible
      character_and_performance: character_and_performance
  - id: render_clip_planning
    module: render_clip_plan_v1
    params:
      engine_pack_id: google_veo31
    after: [shot_planning]
    store_inputs:
      scene_index: scene_index
      timeline: timeline
      track_manifest: track_manifest
    store_inputs_optional:
      normalize: canonical_script
    store_inputs_all:
      shot_plan: shot_plan
  - id: ai_previz
    module: render_adapter_v1
    params:
      prompt_mode: ai_previz
      prompt_artifact_type: ai_previz_prompt
      video_artifact_type: ai_previz_video
      track_type: ai_previz_video
      engine_pack_id: xai_grok_imagine_video
      default_design_study_backfill: true
      require_render_clip_plan: true
      duration_seconds: 4
      resolution: 480p
      consistency_strategy: prompt_only
    after: [render_clip_planning]
    store_inputs:
      track_manifest: track_manifest
    store_inputs_optional:
      project_config: project_config
      intent_mood: intent_mood
    store_inputs_all:
      shot_plan: shot_plan
      render_clip_plan: render_clip_plan
      look_and_feel: look_and_feel
      sound_and_music: sound_and_music
      rhythm_and_flow: rhythm_and_flow
      character_and_performance: character_and_performance
      character_bible: character_bible
      location_bible: location_bible
      keyframe: keyframe
      injected_asset_manifest: injected_asset_manifest
  - id: validate_media
    module: media_validation_v1
    params:
      target_artifact_type: ai_previz_video
    after: [ai_previz]
    store_inputs_all:
      generated_video: ai_previz_video
