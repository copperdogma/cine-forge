recipe_id: animatics_generation
description: >
  Generate scene-level animatics, lockable keyframes, and a project-level
  previz reel from shot plans, storyboard frames, and optional temp audio.
project: {}
stages:
  - id: timeline
    module: timeline_build_v1
    params: {}
    needs: []
    store_inputs:
      scene_index: scene_index
    store_inputs_optional:
      continuity_index: continuity_index
  - id: tracks
    module: track_system_v1
    params: {}
    after: [timeline]
    store_inputs:
      timeline: timeline
    store_inputs_optional:
      continuity_index: continuity_index
  - id: shot_planning
    module: shot_plan_v1
    params:
      work_model: claude-haiku-4-5-20251001
      verify_model: claude-haiku-4-5-20251001
      escalate_model: claude-opus-4-6
    after: [tracks]
    store_inputs:
      normalize: canonical_script
      scene_index: scene_index
      timeline: timeline
      track_manifest: track_manifest
    store_inputs_optional:
      continuity_index: continuity_index
      intent_mood: intent_mood
    store_inputs_all:
      rhythm_and_flow: rhythm_and_flow
      look_and_feel: look_and_feel
      sound_and_music: sound_and_music
      character_bible: character_bible
      character_and_performance: character_and_performance
  - id: storyboards
    module: storyboard_v1
    params: {}
    after: [shot_planning]
    store_inputs:
      track_manifest: track_manifest
    store_inputs_optional:
      project_config: project_config
      intent_mood: intent_mood
    store_inputs_all:
      shot_plan: shot_plan
      look_and_feel: look_and_feel
      character_bible: character_bible
      location_bible: location_bible
  - id: animatics
    module: animatic_v1
    params: {}
    after: [storyboards]
    store_inputs:
      track_manifest: track_manifest
    store_inputs_all:
      shot_plan: shot_plan
      storyboard: storyboard
      sound_and_music: sound_and_music
  - id: keyframes
    module: keyframe_v1
    params: {}
    needs:
      - animatics
    store_inputs:
      track_manifest: track_manifest
    store_inputs_all:
      shot_plan: shot_plan
      storyboard: storyboard
      animatic: animatic
